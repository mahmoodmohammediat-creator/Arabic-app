<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اللغة العربية - الصف الثاني عشر</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a5276; border-bottom: 2px solid #1a5276; padding-bottom: 10px; margin-top: 0; }
        h2 { color: #2e4053; margin-top: 25px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #ebf5fb; margin: 10px 0; padding: 15px; border-right: 5px solid #2980b9; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #2980b9; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>المنصة التعليمية للغة العربية</h1>
        <p>جاري تحميل المنهج التفاعلي...</p>
    </div>

    <script>
    const curriculumData = {
      subject: "اللغة العربية - الصف الثاني عشر (المجلد الأول 2026/2027)",
      modules: [
        {
          title: "المجال الأول: القراءة والنقد الأدبي",
          lessons: [
            { title: "الدرس 1: النصوص حولنا (1)", type: "تطبيقات نصية وتحليل" },
            { title: "الدرس 2: قرآن كريم – الله ولي الذين آمنوا", type: "بلاغة وتفسير" },
            { title: "الدرس 3: مقدمة بحثية – شعر المتنبي", type: "سيرة ونقد أدبي" },
            { title: "الدرس 4: نص شعري – أرق على أرقي (المتنبي)", type: "شعر بلاغي تحليلي" },
            { title: "الدرس 5: نص شعري – البركة (البحتري)", type: "الوصف الطبيعي والموسيقى" },
            { title: "الدرس 6: سيرة غيرية – سلطان بن سالم القاسمي", type: "تكامل توثيقي وسيرة الأدباء" },
            { title: "الدرس 7: قصة قصيرة – علامة تعجب (فاطمة الكعبي)", type: "تحليل سردي ورمزي" },
            { title: "الدرس 8: نص معلوماتي – شاعرتان مبدعتان منذ الصغر", type: "توثيق تاريخي ونقد" },
            { title: "الدرس 9: نص معلوماتي – ذكريات وتوثيق شخصي", type: "مذكرات وتوثيق شخصي" },
            { title: "الدرس 10: نص معلوماتي – أنسنة المدن", type: "تخطيط حضري" },
            { title: "الدرس 11: نص معلوماتي – الذكاء الاصطناعي طبيباً", type: "علوم وتكنولوجيا وحجج" }
          ]
        }
      ]
    };

    window.onload = function() {
      const appContainer = document.getElementById("app");
      let htmlContent = `<h1>${curriculumData.subject}</h1><h2>${curriculumData.modules[0].title}</h2><ul>`;
      
      curriculumData.modules[0].lessons.forEach(lesson => {
        htmlContent += `<li><span><strong>${lesson.title}</strong></span> <span class="badge">${lesson.type}</span></li>`;
      });
      
      htmlContent += `</ul>`;
      appContainer.innerHTML = htmlContent;
    };
    </script>
</body>
</html>
